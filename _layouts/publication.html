---
layout: default
---

<main class="portfolio-shell detail-shell" id="main-content">
  <a class="back-link" href="{{ '/publications/' | relative_url }}" aria-label="Back to publications">
    <span aria-hidden="true">&larr;</span> All publications
  </a>

  <article class="research-detail">
    <header class="detail-header">
      <p class="eyebrow">Research / {{ page.date | date: "%Y" }}</p>
      <h1>{{ page.title }}</h1>
      <p class="detail-authors">{{ page.author }}</p>
      <p class="detail-venue">{{ page.venue }}</p>
    </header>

    <div class="detail-content">
      {{ content }}
    </div>
  </article>
</main>
